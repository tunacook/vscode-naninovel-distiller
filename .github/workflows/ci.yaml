name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        # os: [ubuntu-latest, macos-latest, windows-latest]
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      # pnpm のバージョンは package.json の packageManager で固定する（Dependabot も同じバージョンで lockfile を更新させるため）
      # 10.27.0 に固定している理由: pnpm 10.28+ は git 依存の onlyBuiltDependencies が効かないバグがある（https://github.com/pnpm/pnpm/issues/12367）
      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: 'pnpm'

      # lockfile が公式レジストリ以外（任意の URL や git リポジトリ）からパッケージを取得するように
      # 書き換えられていないかを確認する（lockfile injection 対策）
      # レジストリのパッケージは integrity のみが記録される（URL 取得は tarball 等が付く）ため、それ以外の取得元は自前の naninovel-script-spec だけを許可する
      # git 依存の書式は pnpm のバージョンや操作によって gitHosted / integrity の有無が変わるため、
      # それらは任意とし、tarball がコミット固定の自前リポジトリであることだけを確認する
      - name: Check lockfile sources
        run: |
          bad=$(grep -E '^\s+resolution: \{' pnpm-lock.yaml \
            | grep -vE '^\s+resolution: \{integrity: [^,}]+\}$' \
            | grep -vE '^\s+resolution: \{(gitHosted: true, )?(integrity: [^,}]+, )?tarball: https://codeload\.github\.com/tunacook/naninovel-script-spec/tar\.gz/[0-9a-f]{40}\}$' || true)
          if [ -n "$bad" ]; then
            echo "::error file=pnpm-lock.yaml::公式レジストリ以外から取得するパッケージがあります"
            echo "$bad"
            exit 1
          fi

      # install スクリプト（postinstall 等）を実行しない。マルウェアの主な実行経路を CI 上で動かさないため
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Inspect Dependency
        run: |
          echo "--- Checking files in node_modules ---"
          ls -R node_modules/naninovel-script-spec
          echo "--- Content of index.d.ts ---"
          cat node_modules/naninovel-script-spec/index.d.ts || cat node_modules/naninovel-script-spec/dist/index.d.ts
          echo "--- TypeScript Trace Resolution ---"
          pnpm tsc -p . --traceResolution | grep "naninovel-script-spec" || true

      - name: Lint
        run: pnpm run lint

      - name: Type Check
        run: pnpm run check-types

      - name: Build & Compile Tests
        run: |
          pnpm run compile
          pnpm run compile-tests

      - name: Install dependencies for VS Code tests (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2t64 libgbm1 libgtk-3-0 libnss3 xauth xvfb

      - name: Run tests
        run: |
          if [ "${{ runner.os }}" == "Linux" ]; then
            xvfb-run pnpm test
          else
            pnpm test
          fi
        env:
          VSCODE_LOG_LEVEL: info

      - name: Package VSIX
        run: pnpm exec vsce package --no-dependencies
